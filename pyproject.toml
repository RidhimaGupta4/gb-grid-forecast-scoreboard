[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gridscore"
version = "1.0.0"
description = "A live, pre-registered, leakage-audited forecast scoreboard for GB grid carbon intensity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "pyarrow>=15",
  "requests>=2.31",
]

[project.optional-dependencies]
site = ["plotly>=5.20"]   # only used to vendor plotly.min.js into the built site
dev = ["pytest>=8", "plotly>=5.20"]

[project.scripts]
gridscore = "gridscore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
gridscore = ["site_template/*"]
