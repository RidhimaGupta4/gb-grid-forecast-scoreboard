name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Unit + integration tests (synthetic fixtures only; never touch data/)
        run: pytest
      - name: Verify the hash-chain ledger of the committed data
        run: gridscore verify
