name: site
# Rebuilds and deploys the static dashboard to GitHub Pages after every data-writing run.
on:
  workflow_run:
    workflows: [issue, score]
    types: [completed]
  push:
    branches: [main]
    paths: ["src/**", "pyproject.toml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[site]"
      - name: Build dashboard (shows a BROKEN chip if the hash-chain fails; never hides it)
        run: gridscore site
      - uses: actions/upload-pages-artifact@v3
        with: { path: site_build }
      - id: deploy
        uses: actions/deploy-pages@v4
