name: score
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Collect server-side push receipts (GitHub Events API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gridscore receipts
      - name: Score matured forecasts against real actuals
        run: gridscore score
      - name: Verify the hash-chain
        run: gridscore verify
      - name: Commit and push
        run: |
          git config user.name "gridscore-bot"
          git config user.email "gridscore-bot@users.noreply.github.com"
          git add data
          git commit -m "score: $(date -u +%Y-%m-%d)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1
